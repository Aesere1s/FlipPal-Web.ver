<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">胶片轨道：继续绕行，或剪断离场</title>
  <desc id="desc">用于 FlipPal 首屏沉没成本知识卡。左侧胶片轨道围绕时钟反复绕行，象征继续投入已经付出的时间；右侧剪刀剪断胶片，通向明亮出口，象征及时止损。原创平涂动漫场景，不使用任何外部素材或角色。</desc>
